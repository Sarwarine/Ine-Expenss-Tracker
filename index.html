<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মাসিক খরচ হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --bg: #f2f5f4;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #0f9d70;
    --accent-dark: #0b7a57;
    --accent-soft: #e4f6ee;
    --danger: #e14b4b;
    --danger-soft: #fdeaea;
    --border: #e6e9ec;
    --shadow: 0 2px 10px rgba(20, 30, 25, 0.06);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151a; --card: #1c2027; --text: #f0f2f5; --muted: #98a0ac;
      --accent: #21c98a; --accent-dark: #1aa876; --accent-soft: #16302a;
      --danger: #ef6a6a; --danger-soft: #34191a; --border: #2b303a;
      --shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151a; --card: #1c2027; --text: #f0f2f5; --muted: #98a0ac;
    --accent: #21c98a; --accent-dark: #1aa876; --accent-soft: #16302a;
    --danger: #ef6a6a; --danger-soft: #34191a; --border: #2b303a;
    --shadow: 0 2px 12px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Noto Sans Bengali', 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px 40px; }
  header { text-align: center; margin-bottom: 14px; }
  .today { color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  h1 { font-size: 19px; margin: 0; font-weight: 700; }

  .card {
    background: var(--card); border-radius: 16px; padding: 16px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    margin-bottom: 14px;
  }

  .balance-card { text-align: center; }
  .balance-label { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .balance-amount { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  .balance-amount.over { color: var(--danger); }
  .progress-track { height: 8px; border-radius: 6px; background: var(--border); margin: 12px 0 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width .25s ease; }
  .progress-fill.over { background: var(--danger); }
  .balance-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .balance-meta b { color: var(--text); font-weight: 600; }
  .link-btn { border: none; background: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 0 0 0 3px; }
  .cycle-meta { font-size: 12px; color: var(--muted); margin-top: 10px; }

  .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  input[type="number"], input[type="text"] {
    flex: 1; min-width: 0; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 15px; font-family: inherit;
  }
  input[type="number"] { flex: 0 0 34%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .primary-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .primary-btn:active { background: var(--accent-dark); }
  .primary-btn:disabled { opacity: .6; }

  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
  .expense-list { list-style: none; margin: 0; padding: 0; }
  .expense-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px;
  }
  .expense-item:last-child { border-bottom: none; }
  .exp-note { font-size: 14.5px; font-weight: 500; }
  .exp-date { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .exp-amount { font-weight: 700; color: var(--danger); white-space: nowrap; }
  .del-btn {
    border: none; background: var(--danger-soft); color: var(--danger);
    width: 26px; height: 26px; border-radius: 50%; font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .exp-right { display: flex; align-items: center; gap: 8px; }
  .empty-msg { color: var(--muted); font-size: 13.5px; text-align: center; padding: 10px 0; }

  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .hist-empty { color: var(--muted); font-size: 13px; padding-top: 4px; }

  .hist-details {
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden;
  }
  .hist-details:last-child { margin-bottom: 0; }
  .hist-summary {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 12px; font-size: 13.5px;
  }
  .hist-summary::before { content: "▸ "; color: var(--muted); }
  .hist-details[open] .hist-summary::before { content: "▾ "; }
  .hist-range { font-weight: 600; }
  .hist-total { font-weight: 700; color: var(--danger); }
  .hist-expenses { padding: 0 12px 10px; border-top: 1px solid var(--border); }
  .hist-exp-row {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px dashed var(--border); font-size: 13px;
  }
  .hist-exp-row:last-of-type { border-bottom: none; }
  .hist-exp-note { flex: 1; }
  .hist-exp-date { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .hist-exp-amount { color: var(--danger); font-weight: 600; white-space: nowrap; margin-left: 8px; }
  .hist-meta-sub { color: var(--muted); font-size: 12px; padding-top: 8px; }

  .secondary-btn {
    width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; font-size: 14px;
    cursor: pointer; font-family: inherit; margin-top: 4px; margin-bottom: 10px;
  }
  .secondary-btn:active { filter: brightness(0.95); }

  .danger-btn {
    width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--danger); font-weight: 600; font-size: 14px;
    cursor: pointer; font-family: inherit; margin-top: 4px;
  }
  .danger-btn:active { background: var(--danger-soft); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(10, 15, 12, 0.5);
    align-items: center; justify-content: center; padding: 24px; z-index: 1000;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card); border-radius: 16px; padding: 20px; width: 100%; max-width: 320px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .modal-title { font-weight: 700; font-size: 16px; margin-bottom: 8px; }
  .modal-message { font-size: 14px; color: var(--muted); white-space: pre-line; margin-bottom: 4px; }
  .modal-input {
    display: none; width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 15px; font-family: inherit;
  }
  .modal-input.show { display: block; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-btn {
    flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 14px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .modal-btn.cancel { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .modal-btn.confirm { background: var(--danger); color: #fff; }
  .modal-btn.confirm.positive { background: var(--accent); }
  .offline-note { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="today" id="todayDate"></div>
    <h1>💰 মাসিক খরচ হিসাব</h1>
  </header>

  <section class="card balance-card">
    <div class="balance-label">অবশিষ্ট ব্যালেন্স</div>
    <div class="balance-amount" id="balanceAmount">৳0</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="balance-meta">
      <span>খরচ হয়েছে: <b id="spentAmount">৳0</b></span>
      <span>বাজেট: <b id="salaryAmount">৳0</b></span>
    </div>
    <div class="cycle-meta" id="cycleMeta"></div>
  </section>

  <section class="card">
    <div class="add-row">
      <input type="number" id="amountInput" placeholder="৳ পরিমাণ" inputmode="decimal">
      <input type="text" id="noteInput" placeholder="কী কিনলেন? (নোট)">
    </div>
    <button class="primary-btn" id="addBtn">+ খরচ যোগ করুন</button>
  </section>

  <section class="card">
    <h2>এই মাসের খরচের তালিকা</h2>
    <ul class="expense-list" id="expenseList"></ul>
    <p class="empty-msg" id="emptyMsg">এখনো কোনো খরচ যোগ হয়নি।</p>
  </section>

  <section class="card">
    <h2>আগের মাসগুলোর হিসাব (<span id="historyCount">0</span>)</h2>
    <div id="historyList"></div>
  </section>

  <button class="secondary-btn" id="editSalaryBtn">⚙️ মাসিক বাজেট এডিট করুন (বর্তমান: <span id="currentSalaryLabel">৳0</span>)</button>
  <button class="danger-btn" id="closeCycleBtn">🔒 এই মাসের হিসাব ক্লোজ করে নতুন মাস শুরু করুন</button>
  <div class="offline-note" id="storageNote"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-message" id="modalMessage"></div>
    <input type="number" class="modal-input" id="modalInput" inputmode="decimal">
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancelBtn">বাতিল</button>
      <button class="modal-btn confirm" id="modalConfirmBtn">নিশ্চিত</button>
    </div>
  </div>
</div>

<script>
let dbRef = null;
let usingDb = false;
let state = null;
let saving = false;

function todayISO() { return new Date().toISOString().slice(0, 10); }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmtMoney(n) { return '৳' + Math.round(n).toLocaleString('en-IN'); }
function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function defaultState() {
  return { salary: 60000, cycleStart: todayISO(), expenses: [], history: [] };
}

async function loadState() {
  try {
    if (window.claude && window.claude.use) {
      dbRef = await window.claude.use('db');
    }
  } catch (e) { dbRef = null; }

  if (dbRef) {
    try {
      const snap = await dbRef.doc('budget/state').get();
      if (snap.exists && snap.data()) {
        state = snap.data();
        usingDb = true;
      } else {
        state = defaultState();
        usingDb = true;
        await dbRef.doc('budget/state').set(state);
      }
    } catch (e) {
      usingDb = false;
    }
  }

  if (!state) {
    try {
      const raw = localStorage.getItem('expense_tracker_state');
      state = raw ? JSON.parse(raw) : defaultState();
    } catch (e) {
      state = defaultState();
    }
  }
  if (!state.expenses) state.expenses = [];
  if (!state.history) state.history = [];
  if (!state.salary) state.salary = 60000;
}

async function saveState() {
  if (saving) { setTimeout(saveState, 150); return; }
  saving = true;
  try {
    if (usingDb && dbRef) {
      await dbRef.doc('budget/state').set(state);
    } else {
      localStorage.setItem('expense_tracker_state', JSON.stringify(state));
    }
  } catch (e) {
    try { localStorage.setItem('expense_tracker_state', JSON.stringify(state)); } catch (e2) {}
  }
  saving = false;
}

function render() {
  document.getElementById('todayDate').textContent = fmtDate(todayISO());

  const spent = state.expenses.reduce((s, e) => s + e.amount, 0);
  const balance = state.salary - spent;
  const pct = state.salary > 0 ? Math.min(100, Math.round((spent / state.salary) * 100)) : 0;

  const balEl = document.getElementById('balanceAmount');
  balEl.textContent = fmtMoney(balance);
  balEl.classList.toggle('over', balance < 0);
  const fillEl = document.getElementById('progressFill');
  fillEl.style.width = pct + '%';
  fillEl.classList.toggle('over', balance < 0);

  document.getElementById('spentAmount').textContent = fmtMoney(spent);
  document.getElementById('salaryAmount').textContent = fmtMoney(state.salary);
  document.getElementById('currentSalaryLabel').textContent = fmtMoney(state.salary);
  document.getElementById('cycleMeta').textContent = 'এই মাসের হিসাব শুরু: ' + fmtDate(state.cycleStart);

  const list = document.getElementById('expenseList');
  const empty = document.getElementById('emptyMsg');
  const sorted = [...state.expenses].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  list.innerHTML = '';
  empty.style.display = sorted.length ? 'none' : 'block';
  for (const e of sorted) {
    const li = document.createElement('li');
    li.className = 'expense-item';
    li.innerHTML =
      '<div><div class="exp-note"></div><div class="exp-date"></div></div>' +
      '<div class="exp-right"><span class="exp-amount"></span><button class="del-btn" title="মুছুন">✕</button></div>';
    li.querySelector('.exp-note').textContent = e.note || '(নোট নেই)';
    li.querySelector('.exp-date').textContent = fmtDate(e.date);
    li.querySelector('.exp-amount').textContent = '-' + fmtMoney(e.amount);
    li.querySelector('.del-btn').addEventListener('click', () => deleteExpense(e.id));
    list.appendChild(li);
  }

  const histWrap = document.getElementById('historyList');
  document.getElementById('historyCount').textContent = state.history.length;
  histWrap.innerHTML = '';
  if (!state.history.length) {
    histWrap.innerHTML = '<div class="hist-empty">এখনো কোনো মাস ক্লোজ করা হয়নি।</div>';
  } else {
    for (const h of [...state.history].reverse()) {
      const det = document.createElement('details');
      det.className = 'hist-details';
      const sum = document.createElement('summary');
      sum.className = 'hist-summary';
      sum.innerHTML =
        '<span class="hist-range">' + fmtDate(h.start) + ' – ' + fmtDate(h.end) + '</span>' +
        '<span class="hist-total">-' + fmtMoney(h.total) + '</span>';
      det.appendChild(sum);

      const body = document.createElement('div');
      body.className = 'hist-expenses';
      const sortedH = [...h.expenses].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
      if (!sortedH.length) {
        body.innerHTML = '<div class="hist-meta-sub">কোনো খরচ যোগ হয়নি এই মাসে।</div>';
      } else {
        for (const e of sortedH) {
          const row = document.createElement('div');
          row.className = 'hist-exp-row';
          row.innerHTML =
            '<div><div class="hist-exp-note"></div><div class="hist-exp-date"></div></div>' +
            '<div class="hist-exp-amount"></div>';
          row.querySelector('.hist-exp-note').textContent = e.note || '(নোট নেই)';
          row.querySelector('.hist-exp-date').textContent = fmtDate(e.date);
          row.querySelector('.hist-exp-amount').textContent = '-' + fmtMoney(e.amount);
          body.appendChild(row);
        }
      }
      const metaSub = document.createElement('div');
      metaSub.className = 'hist-meta-sub';
      metaSub.textContent = 'বাজেট: ' + fmtMoney(h.salary) + ' · ' + h.expenses.length + 'টি এন্ট্রি';
      body.appendChild(metaSub);

      det.appendChild(body);
      histWrap.appendChild(det);
    }
  }

  document.getElementById('storageNote').textContent = usingDb
    ? ''
    : 'ডেটা এই ডিভাইসে সংরক্ষিত হচ্ছে।';
}

async function addExpense() {
  const amountInput = document.getElementById('amountInput');
  const noteInput = document.getElementById('noteInput');
  const amount = parseFloat(amountInput.value);
  if (!amount || amount <= 0) { amountInput.focus(); return; }
  const note = noteInput.value.trim();

  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  state.expenses.push({ id: newId(), date: todayISO(), note, amount });
  render();
  await saveState();
  btn.disabled = false;

  amountInput.value = '';
  noteInput.value = '';
  amountInput.focus();
}

let modalResolve = null;

function openModal(opts) {
  const overlay = document.getElementById('modalOverlay');
  const inputEl = document.getElementById('modalInput');
  document.getElementById('modalTitle').textContent = opts.title || '';
  document.getElementById('modalMessage').textContent = opts.message || '';
  inputEl.classList.toggle('show', !!opts.showInput);
  inputEl.value = opts.showInput && opts.inputValue != null ? opts.inputValue : '';
  const confirmBtn = document.getElementById('modalConfirmBtn');
  confirmBtn.textContent = opts.confirmText || 'নিশ্চিত';
  confirmBtn.classList.toggle('positive', !!opts.positive);
  document.getElementById('modalCancelBtn').textContent = opts.cancelText || 'বাতিল';
  overlay.classList.add('open');
  if (opts.showInput) setTimeout(() => inputEl.focus(), 60);
  return new Promise(resolve => { modalResolve = resolve; });
}

function closeModal(result) {
  document.getElementById('modalOverlay').classList.remove('open');
  const r = modalResolve;
  modalResolve = null;
  if (r) r(result);
}

document.getElementById('modalConfirmBtn').addEventListener('click', () => {
  closeModal({ confirmed: true, value: document.getElementById('modalInput').value });
});
document.getElementById('modalCancelBtn').addEventListener('click', () => {
  closeModal({ confirmed: false, value: null });
});
document.getElementById('modalInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') closeModal({ confirmed: true, value: document.getElementById('modalInput').value });
});
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') closeModal({ confirmed: false, value: null });
});

function flashNote(msg) {
  const note = document.getElementById('storageNote');
  note.textContent = msg;
}

async function deleteExpense(id) {
  const res = await openModal({
    title: 'খরচ মুছুন',
    message: 'এই খরচটি মুছে ফেলতে চান?',
    confirmText: 'মুছুন', cancelText: 'বাতিল'
  });
  if (!res.confirmed) return;
  try {
    state.expenses = state.expenses.filter(e => e.id !== id);
    render();
    await saveState();
  } catch (err) {
    flashNote('সমস্যা হয়েছে, আবার চেষ্টা করুন।');
  }
}

async function closeCycle() {
  const spent = state.expenses.reduce((s, e) => s + e.amount, 0);
  const message = 'মোট খরচ: ' + fmtMoney(spent) +
    '\nবাজেট: ' + fmtMoney(state.salary) +
    '\n\nক্লোজ করলে নতুন মাস শুরু হবে এবং বাজেট আবার ' + fmtMoney(state.salary) + ' হয়ে যাবে।';
  const res = await openModal({
    title: 'এই মাসের হিসাব ক্লোজ করবেন?',
    message, confirmText: 'হ্যাঁ, ক্লোজ করুন', cancelText: 'বাতিল'
  });
  if (!res.confirmed) return;

  try {
    const closedExpenses = state.expenses.slice();
    const newHistoryEntry = {
      start: state.cycleStart,
      end: todayISO(),
      salary: state.salary,
      expenses: closedExpenses,
      total: spent
    };
    const newState = {
      salary: state.salary,
      cycleStart: todayISO(),
      expenses: [],
      history: state.history.concat([newHistoryEntry])
    };
    state = newState;
    render();
    await saveState();
  } catch (err) {
    flashNote('সমস্যা হয়েছে, আবার চেষ্টা করুন।');
  }
}

async function editSalary() {
  const res = await openModal({
    title: 'মাসিক বাজেট এডিট করুন',
    message: 'নতুন বাজেটের পরিমাণ (৳) লিখুন:',
    showInput: true, inputValue: state.salary,
    confirmText: 'সেভ করুন', cancelText: 'বাতিল', positive: true
  });
  if (!res.confirmed) return;
  const num = parseFloat(res.value);
  if (!num || num <= 0) return;
  try {
    state.salary = num;
    render();
    await saveState();
  } catch (err) {
    flashNote('সমস্যা হয়েছে, আবার চেষ্টা করুন।');
  }
}

document.getElementById('addBtn').addEventListener('click', addExpense);
document.getElementById('closeCycleBtn').addEventListener('click', closeCycle);
